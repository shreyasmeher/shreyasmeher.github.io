- title: "Build, Borrow, or Just Fine-Tune? Empirical Guidelines for NLP Model Selection in Computational Social Science"
  slug: build-borrow-fine-tune
  section: review
  status: review
  topics: [nlp]
  links:
    - { text: "Model", href: "https://huggingface.co/shreyasmeher/Confli-mBERT" }
  abstract: "Researchers in computational social science increasingly face a consequential choice when adopting natural language processing tools: build a domain-specific model from scratch, borrow and adapt an existing one, or simply fine-tune a general-purpose model on task data? Each approach occupies a different point on the spectrum of performance, cost, and required expertise, yet the discipline has offered little empirical guidance on how to navigate this trade-off. This paper provides such guidance. Using conflict event classification as a test case, I fine-tune ModernBERT on the Global Terrorism Database (GTD) to create Confli-mBERT and systematically compare it against ConfliBERT, a domain-specific pretrained model that represents the current gold standard. Confli-mBERT achieves 75.46% accuracy compared to ConfliBERT's 79.34%. Critically, the four-percentage-point gap is not uniform: on high-frequency attack types such as Bombing/Explosion and Kidnapping, the models are nearly indistinguishable. Performance differences concentrate in rare event categories comprising fewer than 2% of all incidents. I use these findings to develop a practical decision framework applicable to any NLP-assisted classification task: when does the research question demand a specialized model, and when does an accessible fine-tuned alternative suffice? The marginal value of domain-specific pretraining, I show, is a predictable function of class prevalence, error tolerance, and available resources. The model, training code, and data are publicly available on Hugging Face."

- title: "“Why Aren't We Talking About This?” The Attention Trap in Networked Protest"
  slug: attention-trap
  section: review
  status: review
  topics: [comm]
  abstract: "On 2 February 2021, the musician Rihanna tweeted about the Indian farmer protests to her 100 million followers, producing the largest attention spike in the movement's yearlong history. Using 1.02 million tweets classified by a large language model, I show that the intervention displaced the movement's own discourse rather than diluting it with newcomers. Benchmarked against 277 placebo dates, the celebrity share of conversation rose 33 percentage points while the policy share fell 8 points, and a within-user decomposition attributes most of the shift to established participants changing their own speech. The shift carried costs: participants who pivoted hardest toward celebrity content were half as likely to remain active a month later, and a coordinated pro-government campaign penetrated the movement's hashtags for the first time. Comparison with six domestic events shows the pattern is specific to the celebrity shock. I call this dynamic the attention trap."

- title: "Using Messy Text in Future LLM Annotations"
  slug: messy-text
  section: review
  status: review
  topics: [nlp]
  with: "with P.T. Brandt, P. Cuellar-Cuellar & X. Zhao"
  abstract: "When working with real-world text, researchers often inherit corpora and annotations with costly human judgments but were not collected, organized, or annotated for modern text-as-data workflows. This is especially common in social science domains where web-scraped documents are noisy, incomplete, or misaligned with the unit of analysis. We propose codebook attention: a codebook-guided turn-by-turn extractive summarization pipeline that reuses valuable annotations without requiring full re-annotation. For each victim in a corpus of disappearance reports from Mexico, the model processes documents sequentially, extracts verbatim evidence spans for each codebook category, and updates a running structured summary to produce a clean and evidence-traceable document-level representation. Using the codebook as the task schema focuses model attention on the fields that matter for downstream classification and reconnects prior human annotations to contemporary language model workflows. We evaluate the resulting summaries by classifying and comparing the predicted labels with human annotations across multiple open-source models including Llama 3.1, Gemma 3 and Ministral 3. Results suggest that hours of computation can approximate weeks of human coding effort while producing evidence-traceable summaries suitable for downstream human rights and event data research."

- title: "Building Capacity or Building Checks? What EU Enlargement Reports Emphasise and Democratic Backsliding"
  slug: enlargement-reports
  section: working
  status: working
  topics: [exec]
  with: "with A. Zhelyazkova & C. Egger"
  abstract: "Does the European Commission's enlargement reporting emphasise executive strength over institutional checks on executive power, and does that emphasis track later democratic backsliding? Building on Meyerrose's argument that international democracy support can strengthen executives at the expense of the institutions meant to constrain them, we use large language models to content-analyse the Commission's progress reports for 23 candidate countries (105,971 sentences across 207 country-years, 1998 to 2023), separating what each report emphasises (compliance and state capacity versus judicial, legislative, civic, and media checks) from how it assesses each domain. Relating both measures to the V-Dem Liberal Democracy Index, we find that the Commission's assessments track subsequent democratic outcomes while its relative emphasis does not, a contrast that survives bootstrap inference and a coder-based correction for measurement error. Emphasis is nonetheless associated with later decline where judicial constraints are weak."

- title: "Strategic Anticipation and Expert Review: The Determinants of Critical Advisory Opinions from the Dutch Council of State"
  slug: council-of-state
  section: working
  status: working
  topics: [exec]
  with: "with C. Egger & A. Zhelyazkova"
  abstract: "What determines whether an expert advisory body issues a critical opinion on a legislative proposal? This paper investigates the conditions under which the Dutch Council of State (<em>Raad van State</em>) issues critical advisory opinions, testing five competing theoretical mechanisms: institutional learning within coalition governments, legislative experience of the proposing actor, the coalition position of the sponsoring party, ideological distance from the governing majority, and the type of legislative instrument under review. Drawing on 2,898 advisory opinions issued between 2004 and 2025, comprising 2,111 opinions on laws and 785 on executive decrees, we find that instrument type is the strongest predictor of opinion severity: executive decrees receive dramatically milder treatment than laws, with 69% receiving no objections compared to just 13% for laws. Among laws, junior coalition partners attract significantly less critical opinions than leading parties, consistent with anticipatory compliance. Ideological distance from the cabinet median is positively associated with opinion severity, though the effect is modest. These findings suggest that the Council's most consequential effects operate through two channels: institutional deference to delegated legislation, and the anticipatory self-discipline of politically exposed actors."

- title: "On Time, but Empty: How Dutch Ministers Answer Their Critics"
  slug: on-time-but-empty
  section: working
  status: working
  topics: [exec]
  abstract: "Three decades of research on parliamentary questions have mapped who asks them, and almost never what askers get back. I turn to the answers, and to a puzzle: the Dutch government replies to its fiercest critics fastest. Opposition and populist members are answered as quickly as the coalition's own backbenchers, or quicker, and three answers in four miss the 21-day deadline for everyone alike. Timing the answers makes the government look even-handed. Reading them does not. Scoring more than 130,000 question–answer pairs (2010–2025) with a validated large-language-model measure of evasion, I find that critics are answered no more slowly, yet 0.20 to 0.47 standard deviations more evasively, net of cabinet, topic, and ministry. The emptiness is aimed: within a single reply, the substantive sub-questions that demand an account are evaded most, and more so when the asker is a critic. Two probes trace the pattern to its incentives. When a question arrives with a news story attached, critics are answered faster still, yet no more fully; and evasive answers draw no more follow-up questions than responsive ones, so evasion costs a minister nothing. One logic runs through all of it, and it is visibility. Delay is public and punished; evasion is buried, unread, and unpriced. A government that treats some askers worse than others does so through the channel where the discrimination will not be seen. Ministers answer on time, and empty the answer instead."

