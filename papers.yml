- title: "Framework Laws and Fading Oversight: How the Dutch Executive Expanded Its Lawmaking Authority"
  slug: framework-laws
  section: publications
  status: forthcoming
  topics: [exec]
  with: "with C. Egger & A. Zhelyazkova"
  venue: "International Political Science Review"
  abstract: "This paper examines patterns of executive dominance and expansion in the Netherlands, a least-likely case of executive aggrandizement given its strong coalitional governance and consensus culture. Drawing on a legislative dataset, our findings show that executive dominance over the legislative agenda and the overall volume of delegated lawmaking are longstanding and stable: roughly 75% of legislation takes the form of secondary executive acts, a level that does not increase over our study period. What has expanded is the legal technique underpinning this dominance: framework laws have become an increasingly cited basis for transferring regulatory authority to individual ministers, with citations of framework instruments in new executive acts rising markedly since 2017. Weak oversight tools such as motions and parliamentary questions remain the opposition's primary (and historically stable) mode of engagement, but coalition MPs have grown markedly more vocal in using these same tools since 2017, reflecting tensions within fragmented governing coalitions. While large, diverse coalitions create internal checks against outright aggrandizement, the growing reliance on framework laws as a delegation device represents a gradual but consequential shift in how, rather than how much, executive dominance is exercised."

- title: "Preferential Delegation: How Rulemaking Authority Concentrates in the Dutch Law-to-Regulation Network"
  slug: preferential-delegation
  section: proceedings
  status: forthcoming
  topics: [exec]
  venue: "Proceedings of the 15th International Conference on Complex Networks and Their Applications (COMPLEX NETWORKS 2026), Springer Studies in Computational Intelligence"
  abstract: "Executive power in parliamentary democracies grows through ordinary lawmaking: a statute delegates rulemaking authority, and decrees and regulations exercise it. This paper studies that process as a growing network. Each of 13,945 Dutch government decrees and ministerial regulations published between 2010 and 2025 is linked to the instruments it cites as its legal basis, giving 22,157 delegation edges among 1,687 parent instruments. Parent out-degree is heavy-tailed and better described by a lognormal than a power law. Dated arrivals allow estimation of an attachment kernel and a discrete-choice model of parent selection. Attachment is close to linear in a parent's existing degree (exponent 0.89 net of age, ministry and framework status, 0.85 for new instruments alone). Since 2017 fewer new bases have been opened and the within-year Gini of delegation has risen from 0.50 to 0.58. New rulemaking increasingly rests on a few bases that parliament approved once. Communities align with ministries but cut across them. Risk labels assigned by a language model and checked against a twelve-model committee rise only weakly with a parent's size and concentrate on substantive regulatory statutes rather than on the framework acts that absorb most delegation."

- title: "The Political Returns to ICT Investment: Information Control of Authoritarian Regimes"
  slug: political-returns-ict
  section: proceedings
  status: forthcoming
  topics: [info]
  with: "with P. Zhang"
  venue: "Proceedings of the International Congress on Information and Communication Technology (ICICT 2027), Springer Lecture Notes in Networks and Systems"
  abstract: "Why does ICT investment appear to generate lower economic returns in autocracies than in democracies? We argue that authoritarian governments invest in ICT for political as well as economic purposes, and that one important political return is enhanced capacity for information control. Using panel data from Freedom House, V-Dem, and the Open Observatory of Network Interference (OONI), we identify two distinct modes of authoritarian information control through cluster analysis: a <em>Strong Control</em> regime, characterized by extensive state-run filtering and blocking, and a <em>Weak Control</em> regime, which is less infrastructure-intensive. We show that these regimes correspond to systematically different censorship behaviors. More importantly, greater state ICT capacity predicts the adoption of Strong Control: governments with stronger operational capabilities rely more on direct Internet blocking and less on private platforms. The results are consistent with a mechanism in which ICT investment expands state capacity, which in turn facilitates infrastructure-intensive information control and is consequently associated with lower Internet freedom. Conventional measures of economic return may understate the value authoritarian governments derive from ICT investment because they omit its political return."

- title: "Selective Scrutiny: Single-Party Majority and the Strategic Withdrawal of Parliamentary Oversight in India"
  slug: selective-scrutiny
  section: review
  status: rr
  topics: [exec]
  venue: "The Journal of Legislative Studies"
  abstract: "That executive aggrandizement proceeds through legal, procedural channels is well established. This paper asks whether governments that withdraw legislative scrutiny do so indiscriminately, or target the legislation that expands their own power. I develop a theory of strategic procedural aggrandizement for parliamentary systems in which scrutiny is discretionary to the government, and test it by linking 653 Indian parliamentary bills (2009–2026) to the full text of the statutes they became, each scored with a 316-phrase dictionary of executive aggrandizement. Under coalition government, scrutiny tracked stakes: power-expanding bills were referred to committee more often and passed more slowly. Under the single-party majority since 2014, this relationship inverted. Committee referral fell from 74% to 17%, median passage time from 255 to 18 days, and the most aggrandizing statutes cleared parliament in days. The pattern is institutional, not ideological: scrutiny recovered when the majority shrank in 2024. The mechanism generalizes to Westminster-heritage parliaments."

- title: "Silencing the Silencing: The Uneven Amplification of Internet Shutdowns in India's English-Language Press"
  slug: silencing-the-silencing
  section: review
  status: rr
  topics: [info, comm]
  venue: "Political Communication"
  abstract: "India imposes more internet shutdowns than any other country, yet whether its national press places these events before readers has been measured only for single outlets, leaving open whether the silence belongs to the press or to a newspaper. I measure per-event coverage of 556 state-level shutdowns (2013–2024) across three English-language national dailies: the <em>Times of India</em> (TOI), India's largest, through a 1.5 million-article full-text corpus, and <em>The Hindu</em> and <em>The Indian Express</em>, titles editorially more adversarial to the current government, through 3.3 million archive headlines and 32,014 targeted full texts, all classified under one validated rule. In TOI, shutdowns in Jammu and Kashmir receive roughly 2.7 times fewer articles than comparable shutdowns elsewhere. The gap does not replicate: <em>The Hindu</em> shows no detectable J&amp;K deficit, the <em>Express</em> less than half of TOI's, with both interaction estimates significantly above TOI under identical text exposure. During the first seven months of the 2019–20 Kashmir blackout, the longest ever imposed in a democracy, TOI published 23 shutdown articles against 102 in the <em>Express</em> and 118 in <em>The Hindu</em>. Because the outlets face the same reporting conditions, the divergence cannot reflect newsgathering constraints: the silence is a property of one outlet's editorial choices, not of the press field. Whether alignment or audience demand motivates those choices, the accountability reach of a formally free press depends on which outlet dominates its audience, a stratification that indices scoring a press system as a single unit do not register."

- title: "Electoral Accountability and the Channeling of Content Removal: Theory and Evidence from Google Transparency Reports"
  slug: electoral-accountability-content-removal
  section: review
  status: review
  topics: [info]
  with: "with P. Zhang"
  abstract: "How does regime type shape a state's intervention in its information environment? We argue that democracies and non-democracies differ not only in the quantity but, more importantly, in the institutional channel of content removal. To that end, we develop a political agency model and show that a democratic government would refrain from direct executive takedown and instead delegate to the court. This is because electoral accountability disciplines politicians' behavior by providing incentives for reputation-building. We test our hypotheses using data from Google transparency reports. Exploiting quasi-experimental variation in the timing of constitutionally scheduled elections, we provide supporting evidence that compared to non-democracies, takedown requests from democratic governments decline significantly as elections approach. This reputational discipline effect is not observed in authoritarian regimes or other types of requests."

